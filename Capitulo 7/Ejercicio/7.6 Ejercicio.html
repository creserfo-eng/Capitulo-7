<!DOCTYPE html>
<!-- Ejercicio 7.15: Valor más grande -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Valor más grande</title>
      <script>
         var contador = 1;
         var mayor = 0;

         while ( contador <= 10 )
         {
            var numero = parseInt( window.prompt( "Escriba un número entero (" + contador + " de 10):", "0" ) );

            if ( contador === 1 || numero > mayor )
               mayor = numero;

            contador++;
         }

         document.writeln( "<h1>El número más grande encontrado es: " + mayor + "</h1>" );
      </script>
   </head>
   <body></body>
</html>
