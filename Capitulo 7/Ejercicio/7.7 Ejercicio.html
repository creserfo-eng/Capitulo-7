<!DOCTYPE html>
<!-- Ejercicio 7.16: Tabla de valores -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Tabla de valores</title>
      <style>
         table, th, td { border: 1px solid black; border-collapse: collapse; text-align: center; padding: 8px; }
         table { margin: 20px auto; }
      </style>
      <script>
         document.write( "<table>" );
         document.write( "<tr><th>N</th><th>10*N</th><th>100*N</th><th>1000*N</th></tr>" );
         for ( var n = 1; n <= 6; n++ )
         {
            document.write( "<tr><td>" + n + "</td><td>" + ( n * 10 ) + "</td><td>" + ( n * 100 ) + "</td><td>" + ( n * 1000 ) + "</td></tr>" );
         }
         document.write( "</table>" );
      </script>
   </head>
   <body></body>
</html>
