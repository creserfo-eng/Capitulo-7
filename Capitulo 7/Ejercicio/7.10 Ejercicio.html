<!DOCTYPE html>
<!-- Ejercicio 7.21: Ciclo infinito -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ciclo infinito</title>
      <script>
         var numero = 2;
         while ( true )
         {
            document.write( numero + " " );
            numero *= 2; 
         }
      </script>
   </head>
   <body></body>
</html>
