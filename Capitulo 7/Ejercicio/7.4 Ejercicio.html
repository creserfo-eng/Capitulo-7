<!DOCTYPE html>
<!-- Ejercicio 7.13: Comisión de vendedores -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Comisión de vendedores</title>
      <script>
         var ventasTotales = 0;
         var articulo = window.prompt( "Escriba el número de artículo (1-4) o 0 para terminar:", "0" );
         var valor = 0;

         while ( articulo != "0" )
         {
            switch ( parseInt( articulo ) )
            {
               case 1: valor = 239.99; break;
               case 2: valor = 129.75; break;
               case 3: valor = 99.95; break;
               case 4: valor = 350.89; break;
               default: window.alert( "Número de artículo inválido" ); valor = 0;
            }
            ventasTotales += valor;
            articulo = window.prompt( "Escriba el número de artículo (1-4) o 0 para terminar:", "0" );
         }

         var ingresos = 200 + ( ventasTotales * 0.09 );
         document.writeln( "<h1>Ingresos totales de la semana: $" + ingresos.toFixed(2) + "</h1>" );
      </script>
   </head>
   <body></body>
</html>
